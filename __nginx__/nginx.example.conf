# ==============================================================================
# Nginx Configuration Template for Node.js Application
# ==============================================================================
# Description:
# This file serves as a template for setting up Nginx as a reverse proxy 
# for a Node.js application. It handles SSL termination, HTTP to HTTPS 
# redirection, and WebSocket support.
#
# Instructions:
# 1. Copy this file to 'nginx.conf' or include it in your Docker setup.
# 2. Replace all placeholders enclosed in curly braces (e.g., {SERVER_NAME}) 
#    with your actual environment-specific values.
# 3. Ensure the paths for SSL certificates match your server's directory structure.
# ==============================================================================

# Upstream definition for the Node.js application
# Note: If using Docker Compose, ensure 'app' matches the service name defined in docker-compose.yml.
upstream node_app {
    server app:3000; # Internal service address. Change to 'localhost:3000' if running locally without Docker networking.
}

# ==============================================================================
# Server Block: HTTP to HTTPS Redirect
# ==============================================================================
server {
    listen 80;
    # Placeholder: Replace with your domain name (e.g., api.karaflow.com)
    server_name {SERVER_NAME}; 

    # Let's Encrypt / Certbot validation endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Permanent redirect from HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# ==============================================================================
# Server Block: HTTPS (SSL/TLS)
# ==============================================================================
server {
    listen 443 ssl http2;
    # Placeholder: Replace with your domain name (e.g., api.karaflow.com)
    server_name {SERVER_NAME};

    # --- SSL Certificate Configuration ---
    # Placeholder: Replace with the absolute path to your fullchain certificate
    ssl_certificate     {SSL_CERTIFICATE_PATH};       # Example: /etc/nginx/ssl/fullchain.pem
    
    # Placeholder: Replace with the absolute path to your private key
    ssl_certificate_key {SSL_PRIVATE_KEY_PATH};       # Example: /etc/nginx/ssl/privkey.pem

    # Security Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HTTP Strict Transport Security (HSTS)
    # Forces browsers to use HTTPS for 1 year, including subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximum allowed size of the client request body
    client_max_body_size 50m;

    # ======================================================================
    # Location Block: Reverse Proxy & WebSocket Support
    # ======================================================================
    location / {
        # Forward requests to the Node.js upstream
        proxy_pass http://node_app;
        
        # Enable WebSocket support by upgrading the connection
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Pass original client headers to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Bypass cache when using WebSocket upgrades
        proxy_cache_bypass $http_upgrade;
    }
}